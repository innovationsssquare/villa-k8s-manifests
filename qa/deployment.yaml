apiVersion: apps/v1
kind: Deployment

metadata:
  name: villa-backend
  namespace: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: villa-backend
  template:
    metadata:
      labels:
        app: villa-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "villa-qa-role"

        vault.hashicorp.com/agent-inject-secret-config: "secret/data/villa/qa"

        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/villa/qa" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}

    spec:
      serviceAccountName: villa-qa-sa
      containers:
        - name: villa-backend
          image: santosh2585/villa-backend:qa-41
          ports:
            - containerPort: 8086
