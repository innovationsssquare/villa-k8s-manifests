apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: villa-backend-ingress

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx

  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: villa-backend-service

            port:
              number: 80